# Checks each app in apps.list for a new GitHub release once a day and
# publishes the index to GitHub Pages (the gh-pages branch). An app whose
# release hasn't changed keeps its commit; when nothing changed, nothing is
# published. The gh-pages branch is always a single commit, so it doesn't grow.
#
# Needs the repository secret INDEX_GPG_KEY: the index's signing key (an
# ASCII-armoured private key without a passphrase). Its public half is in
# patrone-app-index.flatpakrepo, which Patrone ships.
name: Update the index

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [apps.list, build-index.sh, apply_extra, patrone-app-index.flatpakrepo, .github/workflows/update.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: index

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # librsvg2-common: flatpak build-export checks SVG icons with gdk-pixbuf.
      - name: Install Flatpak and OSTree
        run: sudo apt-get update && sudo apt-get install -y flatpak ostree jq librsvg2-common

      - name: Get the published index
        run: git clone -q --depth 1 --branch gh-pages "https://github.com/$GITHUB_REPOSITORY" site || mkdir site

      - name: Import the signing key
        env:
          KEY: ${{ secrets.INDEX_GPG_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m700 "$GNUPGHOME"
          gpg --batch --import <<<"$KEY"
          echo "GPG_HOMEDIR=$GNUPGHOME" >>"$GITHUB_ENV"
          echo "KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >>"$GITHUB_ENV"

      - name: Update the index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./build-index.sh site/repo "$KEY_ID"

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cp patrone-app-index.flatpakrepo site/
          touch site/.nojekyll
          cd site
          [ -d .git ] || git init -q -b gh-pages
          git add -A
          if git rev-parse -q --verify HEAD >/dev/null && git diff --cached --quiet; then
            echo "Nothing to publish"
            exit 0
          fi
          git checkout -q --orphan published
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Index as of $(date -u +%F)"
          git push -qf "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY" published:gh-pages

      # GitHub turns off a scheduled workflow after 60 days without activity
      # in the repository; enabling it again restarts that count.
      - name: Keep the daily check on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/enable"
